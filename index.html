<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #e94560; margin-bottom: 20px; }
    h2 { color: #0f3460; background: #e94560; padding: 10px; border-radius: 5px; margin: 20px 0 10px; }

    /* Login */
    #login-screen {
      background: #16213e;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      margin: 50px auto;
    }
    #login-screen input, #login-screen button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    #login-screen input { background: #0f3460; color: #fff; }
    #login-screen button {
      background: #e94560;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    #login-screen button:hover { background: #c73650; }
    .error { color: #ff6b6b; margin-top: 10px; }

    /* Panel */
    #panel { display: none; }
    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .user-card {
      background: #16213e;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #e94560;
    }
    .user-card h3 { color: #e94560; }
    .user-card p { color: #aaa; font-size: 14px; margin: 5px 0; }
    .user-card .actions { margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
    .user-card button {
      background: #0f3460;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .user-card button:hover { background: #e94560; }
    .user-card button.danger { background: #8b0000; }
    .user-card button.danger:hover { background: #b22222; }

    /* Logs */
    .logs-controls { margin-bottom: 15px; }
    .logs-controls button {
      background: #8b0000;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #16213e;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #0f3460;
    }
    th { background: #0f3460; color: #e94560; }
    tr:hover { background: #1a2a4e; }
    .action-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: bold;
    }
    .action-lag { background: #ff6b6b; color: #fff; }
    .action-kick { background: #ffa500; color: #fff; }
    .action-ban { background: #8b0000; color: #fff; }
    .action-warn { background: #ffd700; color: #000; }
    .action-msg { background: #4ecdc4; color: #fff; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .topbar button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ÉCRAN DE LOGIN -->
    <div id="login-screen">
      <h1 style="text-align:center;">🔐 Connexion Admin</h1>
      <input type="text" id="admin-name" placeholder="Votre nom d'admin">
      <input type="password" id="admin-password" placeholder="Mot de passe admin">
      <button onclick="login()">Se connecter</button>
      <div id="login-error" class="error"></div>
    </div>

    <!-- PANEL -->
    <div id="panel">
      <div class="topbar">
        <h1>👑 Panel Admin — <span id="current-admin"></span></h1>
        <button onclick="logout()">Déconnexion</button>
      </div>

      <h2>👥 Utilisateurs du panel</h2>
      <div id="users-grid" class="users-grid"></div>

      <h2>📋 Logs des actions</h2>
      <div class="logs-controls">
        <button onclick="clearLogs()">🗑️ Effacer tous les logs</button>
        <button onclick="loadLogs()" style="background:#0f3460;">🔄 Rafraîchir</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Date / Heure</th>
            <th>Admin</th>
            <th>Action</th>
            <th>Cible</th>
          </tr>
        </thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    let currentAdmin = '';

    // Connexion
    async function login() {
      const name = document.getElementById('admin-name').value.trim();
      const password = document.getElementById('admin-password').value;
      const err = document.getElementById('login-error');
      err.textContent = '';

      if (!name) { err.textContent = 'Entrez votre nom.'; return; }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, adminName: name })
        });
        const data = await res.json();
        if (data.success) {
          currentAdmin = data.admin;
          document.getElementById('current-admin').textContent = currentAdmin;
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('panel').style.display = 'block';
          loadUsers();
          loadLogs();
        } else {
          err.textContent = data.message || 'Échec de connexion';
        }
      } catch (e) {
        err.textContent = 'Erreur serveur';
      }
    }

    function logout() {
      currentAdmin = '';
      document.getElementById('panel').style.display = 'none';
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('admin-password').value = '';
    }

    // Charger les utilisateurs
    async function loadUsers() {
      const res = await fetch('/api/users');
      const users = await res.json();
      const grid = document.getElementById('users-grid');
      grid.innerHTML = '';

      users.forEach(u => {
        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `
          <h3>${u.name}</h3>
          <p>Rôle : ${u.role}</p>
          <div class="actions">
            <button onclick="doAction('${u.name}', 'lag')">⚡ Lag</button>
            <button onclick="doAction('${u.name}', 'warn')">⚠️ Warn</button>
            <button onclick="doAction('${u.name}', 'msg')">💬 Message</button>
            <button class="danger" onclick="doAction('${u.name}', 'kick')">👢 Kick</button>
            <button class="danger" onclick="doAction('${u.name}', 'ban')">🚫 Ban</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Effectuer une action et la logger
    async function doAction(target, action) {
      try {
        await fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            admin: currentAdmin,
            action: action,
            target: target
          })
        });
        loadLogs();
      } catch (e) {
        console.error(e);
      }
    }

    // Charger les logs
    async function loadLogs() {
      const res = await fetch('/api/logs');
      const data = await res.json();
      const tbody = document.getElementById('logs-body');
      tbody.innerHTML = '';

      data.forEach(l => {
        const tr = document.createElement('tr');
        const date = new Date(l.timestamp).toLocaleString('fr-FR');
        tr.innerHTML = `
          <td>${l.id}</td>
          <td>${date}</td>
          <td><strong>${l.admin}</strong></td>
          <td><span class="action-badge action-${l.action}">${l.action.toUpperCase()}</span></td>
          <td>${l.target}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Effacer les logs
    async function clearLogs() {
      if (!confirm('Effacer tous les logs ?')) return;
      await fetch('/api/logs', { method: 'DELETE' });
      loadLogs();
    }
  </script>
</body>
</html>
