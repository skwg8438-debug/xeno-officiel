<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title> Panel Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 20% 20%, #1a0b2e 0%, #0a0514 60%, #000 100%);
    color: #eee;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Fond animé avec particules violettes */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(2px 2px at 20% 30%, #a855f7, transparent),
      radial-gradient(2px 2px at 60% 70%, #8b5cf6, transparent),
      radial-gradient(2px 2px at 80% 20%, #c084fc, transparent),
      radial-gradient(2px 2px at 40% 80%, #a855f7, transparent);
    background-size: 300px 300px;
    animation: drift 20s linear infinite;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes drift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-300px, -300px); }
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px;
    position: relative;
    z-index: 1;
  }

  /* LOGIN */
  #login-screen {
    max-width: 420px;
    margin: 80px auto;
    background: rgba(20, 10, 40, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow:
      0 0 40px rgba(168, 85, 247, 0.3),
      inset 0 0 20px rgba(168, 85, 247, 0.05);
    animation: slideUp 0.6s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #login-screen h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 25px;
    background: linear-gradient(90deg, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  #login-screen input {
    width: 100%;
    padding: 14px 16px;
    margin: 10px 0;
    background: rgba(30, 15, 60, 0.6);
    border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: all 0.3s;
  }

  #login-screen input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
  }

  #login-screen button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    background: linear-gradient(135deg, #8b5cf6, #a855f7);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #login-screen button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(168, 85, 247, 0.5);
  }

  .error { color: #ff4d6d; margin-top: 10px; text-align: center; font-size: 14px; }

  /* PANEL */
  #panel { display: none; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding: 15px 25px;
    background: rgba(20, 10, 40, 0.8);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 15px;
    animation: slideUp 0.5s ease;
  }

  .topbar h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .topbar h1 span {
    color: #c084fc;
    -webkit-text-fill-color: #c084fc;
    font-weight: bold;
  }

  .topbar button {
    background: rgba(239, 68, 68, 0.2);
    color: #ff6b6b;
    border: 1px solid rgba(239, 68, 68, 0.4);
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s;
  }

  .topbar button:hover {
    background: rgba(239, 68, 68, 0.4);
    transform: translateY(-2px);
  }

  h2 {
    font-size: 20px;
    margin: 30px 0 15px;
    padding-left: 15px;
    border-left: 4px solid #a855f7;
    color: #e9d5ff;
  }

  /* USERS GRID */
  .users-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
  }

  .user-card {
    background: rgba(20, 10, 40, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(168, 85, 247, 0.25);
    border-radius: 14px;
    padding: 18px;
    transition: all 0.3s;
    animation: slideUp 0.5s ease;
  }

  .user-card:hover {
    transform: translateY(-4px);
    border-color: #a855f7;
    box-shadow: 0 10px 30px rgba(168, 85, 247, 0.25);
  }

  .user-card h3 {
    color: #c084fc;
    font-size: 18px;
    margin-bottom: 5px;
  }

  .user-card .role {
    color: #a78bfa;
    font-size: 13px;
    margin-bottom: 12px;
    display: inline-block;
    padding: 3px 10px;
    background: rgba(139, 92, 246, 0.15);
    border-radius: 20px;
  }

  .user-card .actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .user-card button {
    flex: 1;
    min-width: 60px;
    padding: 8px 6px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.25s;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .user-card button:active { transform: scale(0.95); }

  .btn-lag    { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .btn-lag:hover    { box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
  .btn-warn   { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .btn-warn:hover   { box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }
  .btn-msg    { background: linear-gradient(135deg, #06b6d4, #0891b2); }
  .btn-msg:hover    { box-shadow: 0 0 15px rgba(6, 182, 212, 0.6); }
  .btn-kick   { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
  .btn-kick:hover   { box-shadow: 0 0 15px rgba(139, 92, 246, 0.6); }
  .btn-ban    { background: linear-gradient(135deg, #1f2937, #111827); border: 1px solid #ef4444; }
  .btn-ban:hover    { background: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }

  /* LOGS TABLE */
  .logs-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  .logs-controls button {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    color: #fff;
  }

  .logs-controls .btn-clear {
    background: linear-gradient(135deg, #ef4444, #dc2626);
  }
  .logs-controls .btn-refresh {
    background: linear-gradient(135deg, #8b5cf6, #a855f7);
  }
  .logs-controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
  }

  .table-wrap {
    background: rgba(20, 10, 40, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(168, 85, 247, 0.25);
    border-radius: 14px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid rgba(168, 85, 247, 0.15);
  }

  th {
    background: rgba(139, 92, 246, 0.2);
    color: #c084fc;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  tr { transition: background 0.2s; }
  tr:hover { background: rgba(168, 85, 247, 0.08); }

  .action-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .action-lag  { background: rgba(239, 68, 68, 0.25); color: #ff6b6b; border: 1px solid rgba(239, 68, 68, 0.4); }
  .action-kick { background: rgba(139, 92, 246, 0.25); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.4); }
  .action-ban  { background: rgba(31, 41, 55, 0.6); color: #ff4d6d; border: 1px solid rgba(239, 68, 68, 0.4); }
  .action-warn { background: rgba(245, 158, 11, 0.25); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
  .action-msg  { background: rgba(6, 182, 212, 0.25); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.4); }

  .target-name {
    color: #c084fc;
    font-weight: bold;
  }

  .admin-name {
    color: #e9d5ff;
    font-weight: 600;
  }

  .timestamp {
    color: #a78bfa;
    font-size: 13px;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: rgba(20, 10, 40, 0.95);
    backdrop-filter: blur(15px);
    border: 1px solid #a855f7;
    border-radius: 12px;
    padding: 15px 20px;
    color: #fff;
    box-shadow: 0 10px 40px rgba(168, 85, 247, 0.4);
    animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
    z-index: 1000;
    max-width: 320px;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(100px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateX(100px); }
  }

  .toast .toast-title {
    color: #c084fc;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .toast .toast-msg {
    font-size: 13px;
    color: #e9d5ff;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0a0514; }
  ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 4px; }
</style>
</head>
<body>
<div class="container">

  <!-- LOGIN -->
  <div id="login-screen">
    <h1>🔐 Connexion Admin</h1>
    <input type="text" id="admin-name" placeholder="👤 Votre nom d'admin">
    <input type="password" id="admin-password" placeholder="🔑 Mot de passe">
    <button onclick="login()">⚡ Se connecter</button>
    <div id="login-error" class="error"></div>
  </div>

  <!-- PANEL -->
  <div id="panel">
    <div class="topbar">
      <h1> Panel Admin — <span id="current-admin"></span></h1>
      <button onclick="logout()">🚪 Déconnexion</button>
    </div>

    <h2>👥 Utilisateurs du panel</h2>
    <div id="users-grid" class="users-grid"></div>

    <h2>📋 Logs des actions</h2>
    <div class="logs-controls">
      <button class="btn-clear" onclick="clearLogs()">🗑️ Effacer les logs</button>
      <button class="btn-refresh" onclick="loadLogs()">🔄 Rafraîchir</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Date / Heure</th>
            <th>Admin</th>
            <th>Action</th>
            <th>Cible</th>
          </tr>
        </thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let currentAdmin = '';

  async function login() {
    const name = document.getElementById('admin-name').value.trim();
    const password = document.getElementById('admin-password').value;
    const err = document.getElementById('login-error');
    err.textContent = '';
    if (!name) { err.textContent = '⚠️ Entrez votre nom.'; return; }
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, adminName: name })
      });
      const data = await res.json();
      if (data.success) {
        currentAdmin = data.admin;
        document.getElementById('current-admin').textContent = currentAdmin;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        loadUsers();
        loadLogs();
      } else {
        err.textContent = '❌ ' + (data.message || 'Échec');
      }
    } catch (e) { err.textContent = ' Erreur serveur'; }
  }

  function logout() {
    currentAdmin = '';
    document.getElementById('panel').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('admin-password').value = '';
  }

  async function loadUsers() {
    const res = await fetch('/api/users');
    const users = await res.json();
    const grid = document.getElementById('users-grid');
    grid.innerHTML = '';
    users.forEach((u, i) => {
      const card = document.createElement('div');
      card.className = 'user-card';
      card.style.animationDelay = (i * 0.08) + 's';
      card.innerHTML = `
        <h3>${u.name}</h3>
        <span class="role">${u.role}</span>
        <div class="actions">
          <button class="btn-lag"  onclick="doAction('${u.name}','lag')">⚡ Lag</button>
          <button class="btn-warn" onclick="doAction('${u.name}','warn')">⚠️ Warn</button>
          <button class="btn-msg"  onclick="doAction('${u.name}','msg')">💬 Msg</button>
          <button class="btn-kick" onclick="doAction('${u.name}','kick')">👢 Kick</button>
          <button class="btn-ban"  onclick="doAction('${u.name}','ban')">🚫 Ban</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  async function doAction(target, action) {
    try {
      await fetch('/api/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin: currentAdmin, action, target })
      });
      showToast(`✅ ${currentAdmin} a fait <b>${action.toUpperCase()}</b> sur <b>${target}</b>`);
      loadLogs();
    } catch (e) { console.error(e); }
  }

  async function loadLogs() {
    const res = await fetch('/api/logs');
    const data = await res.json();
    const tbody = document.getElementById('logs-body');
    tbody.innerHTML = '';
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#a78bfa;padding:30px;">Aucun log pour le moment</td></tr>';
      return;
    }
    data.forEach(l => {
      const tr = document.createElement('tr');
      const date = new Date(l.timestamp).toLocaleString('fr-FR');
      tr.innerHTML = `
        <td style="color:#a78bfa;">#${l.id}</td>
        <td class="timestamp">${date}</td>
        <td class="admin-name">${l.admin}</td>
        <td><span class="action-badge action-${l.action}">${l.action}</span></td>
        <td class="target-name">🎯 ${l.target}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function clearLogs() {
    if (!confirm('🗑️ Effacer tous les logs ?')) return;
    await fetch('/api/logs', { method: 'DELETE' });
    loadLogs();
    showToast('️ Logs effacés');
  }

  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<div class="toast-title">📋 Action enregistrée</div><div class="toast-msg">${msg}</div>`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // Enter pour se connecter
  document.getElementById('admin-password').addEventListener('keypress', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
